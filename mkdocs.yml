# mkdocs.yml
site_name: Axiom_Space_Reborn
theme:
  name: material
  language: zh
  palette:
    primary: yellow
    accent: cyan
plugins:
  - search:
      lang: zh
  - tags
dev_addr: 0.0.0.0:8192

# markdown related
markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js
  - javascripts/math.js
  - javascripts/widget.js
